name: AI module quality gate

on:
  pull_request:
    paths:
      - "AI/**"
      - "Be/**"
      - "app/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ai-module.yml"
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sepolia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sepolia_test
      AI_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sepolia_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.10.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AI/requirements.txt

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter be exec prisma generate
      - run: pnpm --filter be exec prisma migrate deploy
      - run: pnpm --filter be build
      - run: python -m pip install -r AI/requirements.txt
      - run: python -m pytest -q
        working-directory: AI
      - run: python -m eval.run_offline
        working-directory: AI
      - run: python -m compileall -q app
        working-directory: AI
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
